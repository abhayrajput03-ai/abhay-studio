<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Duel AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .board-container {
            width: 100%; max-width: 90vmin; margin: 0 auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border-radius: 8px; overflow: hidden;
            display: grid; grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr); aspect-ratio: 1 / 1;
        }
        .square { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 7vmin; cursor: pointer; }
        .light-square { background-color: #f0d9b5; }
        .dark-square { background-color: #b58863; }
        .selected { background-color: #4CAF50 !important; box-shadow: inset 0 0 0 4px rgba(0,0,0,0.2); }
        .piece { line-height: 1; user-select: none; }
        .white { color: #ffffff; text-shadow: 1px 1px 2px #000; }
        .black { color: #000000; text-shadow: 1px 1px 2px #fff; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-2 min-h-screen flex flex-col items-center">
    <div class="mb-4"><h1 class="text-2xl font-bold text-gray-800 p-2 bg-yellow-300 rounded shadow">Chess Duel AI</h1></div>
    <div id="status" class="p-2 mb-4 text-center rounded w-full max-w-md font-bold border bg-white">White's Turn</div>
    
    <div class="flex flex-col gap-4 w-full max-w-4xl items-center">
        <div id="chessboard" class="board-container border-2 border-gray-900"></div>
        
        <div class="w-full max-w-md bg-white rounded-lg shadow p-4 border border-gray-200">
            <h2 class="font-bold text-gray-700 mb-3 flex items-center gap-2">🧠 AI Strategist</h2>
            <div class="grid grid-cols-1 gap-2 mb-4">
                <button onclick="getAi('strategy')" class="bg-blue-600 text-white py-2 rounded text-sm">✨ Strategy</button>
                <button onclick="getAi('move')" class="bg-indigo-600 text-white py-2 rounded text-sm">✨ Best Move</button>
                <button onclick="getAi('trash')" class="bg-red-600 text-white py-2 rounded text-sm">✨ Trash Talk</button>
            </div>
            <div id="ai-box" class="bg-slate-50 p-3 border rounded text-sm h-32 overflow-y-auto italic text-gray-600">
                <div id="ai-loading" class="hidden"><div class="loader mr-2"></div> Thinking...</div>
                <div id="ai-text">Enter API Key below to start!</div>
            </div>
            <button onclick="setKey()" class="mt-3 text-xs text-blue-500 w-full text-center underline">Set API Key</button>
        </div>
    </div>

    <script>
        let apiKey = "";
        let board = [], turn = 'white', selected = null, status = 'active';
        const P = {
            'wk':{s:'♔',c:'white',t:'k'}, 'wq':{s:'♕',c:'white',t:'q'}, 'wr':{s:'♖',c:'white',t:'r'}, 'wb':{s:'♗',c:'white',t:'b'}, 'wn':{s:'♘',c:'white',t:'n'}, 'wp':{s:'♙',c:'white',t:'p'},
            'bk':{s:'♚',c:'black',t:'k'}, 'bq':{s:'♛',c:'black',t:'q'}, 'br':{s:'♜',c:'black',t:'r'}, 'bb':{s:'♝',c:'black',t:'b'}, 'bn':{s:'♞',c:'black',t:'n'}, 'bp':{s:'♟',c:'black',t:'p'}, 'empty':{s:'',c:'none',t:'e'}
        };
        function setKey() { const k = prompt("Enter Gemini API Key:"); if(k) { apiKey = k; document.getElementById('ai-text').textContent = "Key Set!"; } }
        function init() {
            board = [['br','bn','bb','bq','bk','bb','bn','br'],['bp','bp','bp','bp','bp','bp','bp','bp'],['empty','empty','empty','empty','empty','empty','empty','empty'],['empty','empty','empty','empty','empty','empty','empty','empty'],['empty','empty','empty','empty','empty','empty','empty','empty'],['empty','empty','empty','empty','empty','empty','empty','empty'],['wp','wp','wp','wp','wp','wp','wp','wp'],['wr','wn','wb','wq','wk','wb','wn','wr']];
            draw();
        }
        function draw() {
            const b = document.getElementById('chessboard'); b.innerHTML = '';
            for(let r=0; r<8; r++) {
                for(let c=0; c<8; c++) {
                    const sq = document.createElement('div');
                    sq.className = `square ${(r+c)%2===0?'light-square':'dark-square'}`;
                    sq.dataset.r = r; sq.dataset.c = c;
                    sq.onclick = () => handleClick(r, c, sq);
                    const piece = P[board[r][c]];
                    if(piece.t !== 'e') {
                        const s = document.createElement('span'); s.className = `piece ${piece.c}`; s.textContent = piece.s; sq.appendChild(s);
                    }
                    if(selected && selected.r === r && selected.c === c) sq.classList.add('selected');
                    b.appendChild(sq);
                }
            }
        }
        function handleClick(r, c, el) {
            if(status !== 'active') return;
            const piece = P[board[r][c]];
            if(!selected || (piece.c === turn && (selected.r !== r || selected.c !== c))) {
                if(piece.c === turn) selected = {r, c}; else selected = null;
                draw(); return;
            }
            if(move(selected, {r, c})) {
                if(P[board[r][c]].t === 'p' && (r === 0 || r === 7)) board[r][c] = turn === 'white' ? 'wq' : 'bq';
                selected = null; turn = turn === 'white' ? 'black' : 'white';
                updateStatus(); draw();
            } else { selected = null; draw(); }
        }
        function move(f, t) {
            const p = P[board[f.r][f.c]], tar = P[board[t.r][t.c]];
            if(f.r === t.r && f.c === t.c || tar.c === p.c) return false;
            const dr = Math.abs(t.r-f.r), dc = Math.abs(t.c-f.c), adr = t.r-f.r;
            let ok = false;
            if(p.t === 'p') {
                let dir = p.c === 'white' ? -1 : 1, start = p.c === 'white' ? 6 : 1;
                if(dc === 0 && adr === dir && tar.t === 'e') ok = true;
                else if(dc === 0 && adr === 2*dir && f.r === start && tar.t === 'e' && path(f,t)) ok = true;
                else if(dc === 1 && adr === dir && tar.c !== 'none') ok = true;
            } else if(p.t === 'n') ok = (dr === 2 && dc === 1) || (dr === 1 && dc === 2);
            else if(p.t === 'r') ok = (dr === 0 || dc === 0) && path(f,t);
            else if(p.t === 'b') ok = (dr === dc) && path(f,t);
            else if(p.t === 'q') ok = (dr === 0 || dc === 0 || dr === dc) && path(f,t);
            else if(p.t === 'k') ok = dr <= 1 && dc <= 1;
            if(ok) { if(tar.t === 'k') status = turn.toUpperCase() + " WINS!"; board[t.r][t.c] = board[f.r][f.c]; board[f.r][f.c] = 'empty'; return true; }
            return false;
        }
        function path(f, t) {
            let dr = Math.sign(t.r-f.r), dc = Math.sign(t.c-f.c), r = f.r+dr, c = f.c+dc;
            while(r !== t.r || c !== t.c) { if(P[board[r][c]].t !== 'e') return false; r += dr; c += dc; } return true;
        }
        function updateStatus() {
            const s = document.getElementById('status'); s.textContent = status === 'active' ? turn.toUpperCase() + "'s Turn" : status;
            s.className = `p-2 mb-4 text-center rounded w-full max-w-md font-bold border ${turn === 'white' ? 'bg-white text-gray-800' : 'bg-gray-800 text-white'}`;
        }
        async function getAi(type) {
            if(!apiKey) return alert("Please set API Key first.");
            const t = document.getElementById('ai-text'), l = document.getElementById('ai-loading');
            l.classList.remove('hidden'); t.classList.add('hidden');
            const prompt = `Turn: ${turn}. Board: ${board.map(r=>r.join('|')).join('\n')}. Action: ${type}`;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const d = await res.json(); t.textContent = d.candidates[0].content.parts[0].text;
            } catch(e) { t.textContent = "Error. Check key."; }
            l.classList.add('hidden'); t.classList.remove('hidden');
        }
        init();
    </script>
</body>
</html>
